name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Projeto do GitHub Pages fica em usuario.github.io/<repo>/, então os caminhos dos
          # assets precisam desse prefixo (ver vite.config.js e src/routes/router.jsx).
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback (404.html)
        # GitHub Pages não faz rewrite de rotas no servidor. Servir o mesmo index.html em
        # qualquer caminho não encontrado permite que o React Router assuma a navegação no
        # cliente para deep links (ex.: /Clin-ca/tratamentos acessado direto).
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
