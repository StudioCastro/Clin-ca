<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2C69"/>
      <stop offset="100%" stop-color="#2E63C7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF1FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect y="860" width="1600" height="140" fill="#F5F5F5"/>

  <!-- árvore à esquerda -->
  <ellipse cx="140" cy="560" rx="120" ry="150" fill="#0A2C69"/>
  <ellipse cx="80" cy="620" rx="90" ry="110" fill="#123B7A"/>
  <rect x="128" y="660" width="20" height="200" fill="#0A2C69"/>

  <!-- corpo do prédio -->
  <rect x="330" y="330" width="950" height="530" fill="#111111"/>
  <rect x="330" y="300" width="560" height="55" fill="#FFFFFF"/>
  <rect x="330" y="300" width="560" height="18" fill="#EAF1FF"/>

  <!-- pilar de entrada -->
  <rect x="335" y="380" width="70" height="480" fill="#1E5FCC" opacity="0.9"/>
  <line x1="345" y1="400" x2="395" y2="450" stroke="#2E63C7" stroke-width="4" opacity="0.6"/>
  <line x1="345" y1="470" x2="395" y2="520" stroke="#2E63C7" stroke-width="4" opacity="0.6"/>
  <line x1="345" y1="540" x2="395" y2="590" stroke="#2E63C7" stroke-width="4" opacity="0.6"/>

  <!-- vidro / entrada iluminada -->
  <rect x="430" y="390" width="420" height="440" fill="url(#glow)" opacity="0.95"/>
  <line x1="640" y1="390" x2="640" y2="830" stroke="#0A2C69" stroke-width="6"/>
  <rect x="480" y="640" width="130" height="70" rx="6" fill="#EAF1FF"/>
  <rect x="640" y="600" width="150" height="16" rx="8" fill="#EAF1FF"/>
  <rect x="500" y="560" width="60" height="60" rx="10" fill="#3B82F6" opacity="0.35"/>

  <!-- dente + wordmark na parede -->
  <path
    d="M0,-100 C50,-100 80,-70 85,-20 C90,10 85,40 75,65 C68,85 60,100 45,100 C35,100 30,80 15,80 C5,80 5,95 0,95 C-5,95 -5,80 -15,80 C-30,80 -35,100 -45,100 C-60,100 -68,85 -75,65 C-85,40 -90,10 -85,-20 C-80,-70 -50,-100 0,-100 Z"
    fill="#FFFFFF"
    transform="translate(1020,470) scale(0.55)"
  />
  <text x="1020" y="590" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="600" fill="#FFFFFF" text-anchor="middle">SORRISO</text>
  <text x="1020" y="622" font-family="Arial, sans-serif" font-size="18" letter-spacing="3" fill="#EAF1FF" text-anchor="middle">ODONTOLOGIA</text>

  <!-- degraus -->
  <path d="M540,860 L1040,860 L990,910 L590,910 Z" fill="#FFFFFF"/>
  <path d="M590,910 L990,910 L960,945 L620,945 Z" fill="#EAF1FF"/>
  <path d="M620,945 L960,945 L940,975 L640,975 Z" fill="#F5F5F5"/>

  <!-- luzes de jardim -->
  <circle cx="560" cy="930" r="9" fill="#3B82F6"/>
  <circle cx="1020" cy="930" r="9" fill="#3B82F6"/>
  <circle cx="600" cy="965" r="9" fill="#3B82F6"/>
  <circle cx="980" cy="965" r="9" fill="#3B82F6"/>

  <!-- arbustos -->
  <ellipse cx="470" cy="900" rx="70" ry="45" fill="#123B7A"/>
  <ellipse cx="1120" cy="900" rx="70" ry="45" fill="#123B7A"/>
  <ellipse cx="1200" cy="920" rx="55" ry="35" fill="#0A2C69"/>
</svg>
