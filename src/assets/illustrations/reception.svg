<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect width="800" height="430" fill="#F5F5F5"/>
  <rect y="430" width="800" height="170" fill="#EAF1FF"/>

  <!-- ripado de madeira estilizado (parede) -->
  <g opacity="0.5">
    <rect x="120" y="60" width="10" height="330" fill="#D8DEE9"/>
    <rect x="145" y="60" width="10" height="330" fill="#D8DEE9"/>
    <rect x="170" y="60" width="10" height="330" fill="#D8DEE9"/>
    <rect x="560" y="60" width="10" height="330" fill="#D8DEE9"/>
    <rect x="585" y="60" width="10" height="330" fill="#D8DEE9"/>
    <rect x="610" y="60" width="10" height="330" fill="#D8DEE9"/>
  </g>

  <!-- quadro decorativo -->
  <rect x="70" y="120" width="90" height="120" rx="4" fill="#EAF1FF" stroke="#3B82F6" stroke-width="4"/>

  <!-- logo na parede -->
  <path
    d="M0,-100 C50,-100 80,-70 85,-20 C90,10 85,40 75,65 C68,85 60,100 45,100 C35,100 30,80 15,80 C5,80 5,95 0,95 C-5,95 -5,80 -15,80 C-30,80 -35,100 -45,100 C-60,100 -68,85 -75,65 C-85,40 -90,10 -85,-20 C-80,-70 -50,-100 0,-100 Z"
    fill="#0F3D91"
    transform="translate(400,175) scale(0.45)"
  />
  <text x="400" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" fill="#0F3D91" text-anchor="middle">SORRISO</text>
  <text x="400" y="266" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#3B82F6" text-anchor="middle">ODONTOLOGIA</text>

  <!-- sofá -->
  <rect x="60" y="330" width="230" height="100" rx="24" fill="#3B82F6" opacity="0.85"/>
  <rect x="60" y="310" width="230" height="45" rx="20" fill="#3B82F6"/>
  <rect x="50" y="420" width="14" height="40" fill="#0A2C69"/>
  <rect x="276" y="420" width="14" height="40" fill="#0A2C69"/>

  <!-- poltronas -->
  <path d="M340,340 a45,45 0 0 1 90,0 v55 h-90 z" fill="#EAF1FF" stroke="#3B82F6" stroke-width="5"/>
  <path d="M450,340 a45,45 0 0 1 90,0 v55 h-90 z" fill="#EAF1FF" stroke="#3B82F6" stroke-width="5"/>

  <!-- mesa de centro -->
  <ellipse cx="410" cy="450" rx="95" ry="24" fill="#0F3D91" opacity="0.18"/>
  <ellipse cx="410" cy="440" rx="95" ry="24" fill="#FFFFFF" stroke="#0F3D91" stroke-width="4"/>
  <line x1="335" y1="450" x2="335" y2="490" stroke="#0F3D91" stroke-width="6"/>
  <line x1="485" y1="450" x2="485" y2="490" stroke="#0F3D91" stroke-width="6"/>

  <!-- planta -->
  <path d="M660,300 C630,260 640,210 660,190 C680,220 690,270 660,300 Z" fill="#123B7A"/>
  <path d="M660,300 C695,265 710,220 700,195 C670,215 645,260 660,300 Z" fill="#1E5FCC"/>
  <path d="M660,300 C640,270 615,235 620,205 C650,220 670,260 660,300 Z" fill="#0A2C69"/>
  <rect x="635" y="298" width="50" height="46" rx="6" fill="#EAF1FF" stroke="#3B82F6" stroke-width="4"/>

  <!-- balcão de recepção -->
  <rect x="600" y="360" width="180" height="100" rx="10" fill="#0F3D91"/>
  <rect x="600" y="360" width="180" height="16" rx="8" fill="#0A2C69"/>
</svg>
